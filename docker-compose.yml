services:
  etl:
    build: .
    image: etl-dsl:polars
    volumes:
      # Programas y datos de demo; los SINK escriben junto a cada .etl.
      - ./input:/app/input
      # Python generado por el compilador.
      - ./output:/app/output
      # Programas con errores para mostrar los diagnósticos.
      - ./demo:/app/demo

  web:
    image: etl-dsl:polars
    build: .
    # Escucha en todas las interfaces del contenedor; compose solo publica el puerto en este equipo.
    command: ["sh", "-c", "python scripts/create_demo_data.py && python -m etl_dsl.web --host 0.0.0.0"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./input:/app/input
      - ./demo:/app/demo

  tests:
    image: etl-dsl:polars
    build: .
    command: ["python", "-m", "unittest", "discover", "-v"]
    profiles: ["tests"]

  bench:
    image: etl-dsl:polars
    build: .
    # Scripts, datos TPC-H y resultados de los benchmarks quedan en bench/ del repositorio.
    volumes:
      - ./bench:/app/bench
    # Datos, verificación, mediciones y zip; ver bench/README.md.
    command: ["python", "bench/todo.py"]
    profiles: ["bench"]
