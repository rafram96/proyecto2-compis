services:
  etl:
    build:
      context: .
      target: compiler
    image: etl-dsl:polars
    volumes:
      # Programas y datos de demo; los SINK escriben junto a cada .etl.
      - ./input:/app/input
      # Python generado por el compilador.
      - ./output:/app/output
      # Programas con errores para mostrar los diagnósticos.
      - ./demo:/app/demo

  tests:
    image: etl-dsl:polars
    build:
      context: .
      target: compiler
    command: ["python", "-m", "unittest", "discover", "-v"]
    profiles: ["tests"]


  cauce:
    build:
      context: .
      target: service
    profiles: [web]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - cauce-data:/app/data
    # Límite del contenedor completo adicional al RSS muestreado por trabajo.
    mem_limit: 1g
    cpus: 2
    init: true

  dev-api:
    profiles: [dev]
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: ["sh", "-c", "python -m service.prepare && exec python -m uvicorn service.app:app --host 0.0.0.0 --port 8000 --reload --reload-dir etl_dsl --reload-dir service --no-access-log"]
    volumes:
      - .:/app
      - dev-data:/app/data
    init: true

  dev-web:
    profiles: [dev]
    image: node:24-slim
    working_dir: /app/web
    command: ["sh", "-c", "npm ci && exec npm run dev -- --host 0.0.0.0 --strictPort"]
    environment:
      CAUCE_API_TARGET: http://dev-api:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - dev-api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - dev-node-modules:/app/web/node_modules
    init: true

volumes:
  dev-data:
  dev-node-modules:
  cauce-data:
