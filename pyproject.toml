[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "polars-etl-dsl"
version = "0.1.0"
description = "Compilador Lark de pipelines ETL a Python con motor Polars"
requires-python = ">=3.11"
dependencies = ["lark>=1.2,<2", "polars>=1.30"]

[project.optional-dependencies]
# Solo para los conectores DUCKDB y los datos de demo.
duckdb = ["duckdb>=1.4,<2"]
# Entorno web: python -m etl_dsl.web
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
etl-dsl = "etl_dsl.main:main"

[tool.setuptools.packages.find]
include = ["etl_dsl*"]

[tool.setuptools.package-data]
etl_dsl = ["*.lark", "web/static/*"]
