    <script>
      // Antes de pintar: tema guardado y la clase .js que habilita las animaciones de entrada.
      try {
        var t = localStorage.getItem("cauce-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        if (t === "dark") document.querySelector('meta[name="theme-color"]').content = "#0a1628";
      } catch (e) {}
      document.documentElement.classList.add("js");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui">Stream necesita JavaScript para el editor y el compilador en el navegador. El código está en GitHub: rafram96/proyecto2-compis.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
